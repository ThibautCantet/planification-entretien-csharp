version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: planification_entretien_db
    environment:
      POSTGRES_DB: planification_entretien
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d planification_entretien"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

